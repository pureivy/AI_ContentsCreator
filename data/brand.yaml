# 편집 확정 규칙(2026-10-05 사장님 확정 — 참고 블로그 서식 이식). 블로그 작가·리비전·제목 포장에만 들어간다(brand.ts editorRulesGuide).
# 2026-10-05 저녁 사장님 결정 — 1번 '한 문장 한 줄'을 '한 줄에 1~2문장'으로 완화("~이고요." 토막 줄이 구조적으로 생겼다). 1인칭 주어 금지 유지, 바탕 어미는 해요체+합쇼체.
editorRules:
  - 휴대폰에서 읽기 쉽게 줄을 자주 바꾼다 — 한 줄에 1~2문장이고, 이어지는 짧은 생각은 "그래서·그런데·-는데"로 한 줄에 잇는다. 앞 문장에 붙어야 할 짧은 꼬리("~이고요.", "~죠.")를 혼자 한 줄로 세우지 않는다. 문장은 짧게(40자 안팎), 생각 덩어리가 바뀔 때만 빈 줄을 넣는다. 표·인용(>)·프레임(>>>)·목록 줄은 각자의 규칙대로 둔다.
  - 글 맨 위, 도입 문장보다 먼저 이 글의 답을 두 줄로 요약한다 — 각 줄은 짧은 한 문장(25자 안팎)이고 줄 전체를 **…** 로 감싼다(마침표까지 ** 안에). 두 줄 중 한 줄에는 글의 주제(핵심 키워드)를 바른 띄어쓰기와 조사로 자연스럽게 담는다 — 검색어 꼴("○○ 심는시기")을 주어로 세우거나 "~의"로 잇지 말고 "○○는 … 심어요"처럼 말한다. 이 두 줄은 도입(도입 유형)과 별도 줄이고, 그다음 줄부터 도입을 시작하되 요약 문장·날짜를 되풀이하지 않는다.
  - 독자가 기억할 핵심 예시 문장(판단 기준, 직접 확인해 볼 말) 한두 개는 줄 전체를 **굵게** 감싼 단독 줄로 보여 줘도 된다 — 글당 1~3줄, 남발하지 않는다.
  - 어렵거나 예스러운 말에는 일상어를 함께 쓴다 — "이식"은 "옮겨 심기", "식재"는 "심기"처럼, 처음 읽는 사람이 멈추지 않게 바로 알아듣는 말을 먼저 쓴다.
  - 원예 용어는 써도 되지만 글에서 처음 나올 때 반 문장으로 풀어 준다 — 전정(가지치기), 시비(거름 주기), 활착(뿌리가 새 흙에 자리 잡음), 수관(가지와 잎이 이루는 윗부분), 도장지(위로만 웃자란 가지), 대목·접수(접붙일 밑나무·윗가지), 접목묘·실생묘(접붙여 키운 묘목·씨앗에서 키운 묘목), 개화주·결실주(꽃·열매를 볼 만큼 자란 나무), 멀칭(흙 위를 덮어 주기), 맹아(밑동에서 새로 돋는 순), 수고(나무 키).
  - '"전자/후자", "앞의 것/뒤의 것" 같은 가리키는 말 대신 그 대상의 이름을 다시 쓴다 — "후자가 더 빨리 자랍니다"가 아니라 "접목묘가 더 빨리 자랍니다". 앞 문장에 가리킬 대상이 없는 "그게·그 부담·그 무렵"도 같다 — 대상 이름을 쓴다. 한 번 정한 이름은 글 끝까지 바꾸지 않는다 — 잘라 낸 것을 "삽수"라고 부르기 시작했으면 같은 것을 다시 "가지"로 부르지 않는다(2026-10-12 사장님 확정).'
  - 새로 지어낸 비유·조어 대신 일상에서 쓰는 말로 쓴다 — "1년에 가위를 몇 번 들 수 있는가"(실제 있었던 문장)가 아니라 "1년에 몇 번 전정하는지".
  - 문장·줄·표 같은 글의 부분이나 사물을 주어로 세워 사람처럼 움직이게 쓰지 않는다 — "이 표가 답을 알려 줍니다", "첫 줄이 시선을 붙잡습니다" 대신 "표를 보면 … 알 수 있습니다". 나무가 물을 끌어올리는 것 같은 실제 생장 서술은 그대로 쓴다.
  - 소제목만 훑어도 그 섹션이 무엇을 다루는지 바로 알게 쓴다 — 비유·말장난 대신 다루는 대상과 핵심을 담는다(소제목 형식 지시가 따로 있으면 그 형식 안에서).
  - 제목이 약속한 상황(어떤 나무를, 언제, 무엇을)을 본문 첫 장면이 그대로 다룬다 — 시기 자료(이번 달 작업 등)에 끌려 제목에 없는 장면으로 바꾸지 않는다.
  - 영어를 직역한 말은 쓰지 않는다 — 기간을 뜻하는 "창"(영어 window — "가을 식재 창", "마지막 가을 창입니다"), "윈도우", "방향을 가져가다"(take) 대신 "가을에 심을 수 있는 때", "늦어도 △월까지", "방향으로 간다"처럼 일상어로 쓴다("마지막"은 근거 없는 마감 선언이 되므로 대체어로도 쓰지 않는다). 자료·브리프에 그런 말이 있어도 옮겨 적지 않는다.
  - '이유(왜 그런지)와 방법(어떻게 하는지)을 한 문단에 섞지 않는다 — 이유를 다 말한 뒤 방법으로 넘어가고, 방법은 실제로 하는 순서대로 한 문장에 한 동작씩 쓴다. 고르는 법을 말하던 문단 한가운데에 흙 깊이·봄 확인 같은 다른 단계가 끼어들지 않게 한다. 할 일이 없는 글(구별·이야기)에는 방법 부분을 억지로 만들지 않고, 단계 수를 "N단계"로 내세우지 않는다.'
  - '주의할 점은 그 행동을 말하는 자리 바로 앞에 두고, 하지 말 일과 그 결과를 함께 쓴다 — 「○○하지 마세요. △△됩니다.」 꼴. 경고 내용은 이 글의 근거 자료에 있는 것만 쓴다(이 규칙의 꼴을 내용으로 옮기지 않는다). 경고를 상관없는 문단 중간이나 글 끝 요약에만 두지 않는다.'
  - '뒤에서 말하겠다고 예고한 내용은 바로 이어서 말한다 — 예고만 하고 끝내 말하지 않는 문장은 쓰지 않는다(실제 있었던 문장: "봄에 같은 일을 하면 손해 보는 게 하나 더 있습니다. 가을은 그 부담이 없습니다." — 그 손해가 무엇인지 글 어디에도 없었다). 말할 근거가 없으면 예고 문장째 뺀다. 글 끝의 다음 글 예고는 이 규칙과 무관하다.'
# 파생 문체 확정 규칙(2026-10-12 사장님 확정 — 모과나무 삽목 파생물 점검). 숏폼 기획·카드뉴스 기획·두 수정 경로에만 들어간다(brand.ts mediaRulesGuide).
# 블로그 editorRules 를 그대로 쓰지 않는 이유: 굵은 요약·소제목·한 줄 규칙은 씬·카드 판형과 충돌하고, 훅·여운 장의 궁금증은 매체 설계라 '바로 다음에서 답하기'로 바꿨다.
mediaRules:
  - '같은 대상은 영상·카드 세트 끝까지 한 이름으로 부른다 — 내레이션·화면 글자·표지·캡션·설명까지 같다. 숏폼은 귀로 듣는 매체라 "삽수" 같은 전문어보다 "가지"처럼 듣자마자 아는 이름을 골라 끝까지 쓴다. 앞 장면·앞 장에 가리킬 대상이 없는 "그게·그 부담" 대신 대상 이름을 쓴다.'
  - '한 장면(카드 한 장)에는 동작 하나와 그 이유만 싣는다. 이유를 다루는 장과 방법을 다루는 장이 따로 있으면 이유 장을 앞에 둔다. 헤드라인이 방법이면 본문도 그 방법을 말한다(실측: 헤드라인 "다르게 묶으세요"에 본문은 가지 구별법이었다).'
  - '원문의 경고는 줄이더라도 하지 말 일과 그 결과를 함께 남기고(「○○하지 마세요. △△돼요」 꼴), 그 동작을 말하는 장면·장 바로 앞이나 같은 장에 둔다. 경고를 지우고 반대로 읽히는 말을 쓰지 않는다(실측: 원문의 "그때 확인하지 마라" 경고가 파생물에서 "그때 바로 보여요"로 뒤집혔다). 경고 내용은 원문에 있는 것만 쓴다.'
  - '시기·기간 말은 줄이지 않는다 — "이듬해", "잎이 진 뒤"를 "봄", "지금"으로 바꾸면 뜻이 달라진다. 원문에 없는 마감·단정("지금 꽂아야 삽니다", "끈 색이 답입니다")을 제목·화면 글자·설명·상단 문구·대체 제목에 새로 만들지 않는다.'
  - '훅·표지·여운 장이 남긴 궁금증은 바로 다음 장면·다음 장에서 답한다. 끝내 답하지 않는 궁금증은 만들지 않는다(실측: 카드 "흙 얕으면 생기는 문제"에 그 문제가 끝내 없었다). 답할 근거가 원문에 없으면 그 궁금증을 만들지 않는다. 다음 편 예고는 이 규칙과 무관하다.'
  - '단정 수위는 원문만큼 — 글자를 줄일 때 "~할 수 있어요", "보통" 같은 유보를 먼저 지우지 않는다. 원문이 "어느 쪽이 나은지 미리 모른다"고 한 두 갈래를 좋음/나쁨 비교(compare)로 나누지 말고 나란히(list) 놓는다. 대체 제목도 본문과 같은 뜻이어야 한다(실측: 대체 제목 "그냥 버리세요"가 영상과 정반대였다).'
