name: bionditree
industry: 나무·묘목 (유실수·조경수·정원수)
description: 비온디트리(bionditree). 경북 경산 등에서 재배한 유실수·조경수·정원수 묘목을 온라인·방문으로 판매하는 농장.
  1~3년생 접목묘, 화분묘·노지묘를 다루며, 밭에서 찍은 실제 영상으로 심기·전정·관리를 기록한다. 작게 시작해도 충분히 자랍니다.
products:
  - name: 유실수 묘목
    features: 사과·자두·복숭아·블루베리 등 25종, 접목묘, 품종 표기
    target: 마당·텃밭에 과일나무 한두 그루 심는 가정
  - name: 조경수·정원수 묘목
    features: 배롱나무·단풍·회양목 등, 생울타리·심볼트리
    target: 전원주택·마당 조경
audience: 30~60대 초보 정원가, 귀농·전원주택, 첫 묘목 구매자 — 전문 농가 아님
region: 경북 경산
tone: 옆에서 알려주는 실무자 말투, 존댓말, 과장·구매 압박 없음, 실패 경험도 그대로 씀
banned:
  - 채소·텃밭 작물 주제(배추·상추·토마토·가을채소·베란다 채소 등) — 나무·묘목 브랜드와 무관
  - 화초·구근·꽃 모종 주제(튤립·수선화·페튜니아·제라늄 등)
  - 다육·선인장·관엽 등 나무가 아닌 화분 식물 주제
