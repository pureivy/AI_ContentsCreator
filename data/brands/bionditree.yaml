genreAxes:
  - 키우는 과정의 관찰·실패와 회복 기록
  - 계절별 실제 작업(심기·전정·물·거름·월동)
  - 증상에서 원인으로 좁혀가는 진단
  - 품종·수종 특성과 고르는 기준
  - 구매·식재 판단
  - 우리가 심는 나무의 야생 친척 구별(잎·수피·열매)
  - 나무가 스스로 하는 일(개화·단풍·낙엽) 관찰 이야기
  - 수종별 이름·꽃말·유래 이야기(수종 앵커 필수)
# 내용 모듈(2026-09-17) — 수종만 바뀐 채 매 글에 반복되던 소재 덩어리. 최근 5편에 나온 모듈은 이번 글에서 금지.
# 실측(75편): 묘목 보는 자리 80% · 잎 진 뒤/첫해 78% · 화분 61% · 거름 자리 60%.
contentModules:
  - name: 묘목 보는 자리
    match: [묘목, 뿌리목, 접목부, 접붙]
  - name: 화분 vs 마당
    match: [화분]
  - name: 시기 미루기(잎 진 뒤)
    match: [잎이 진, 잎이 다 진, 낙엽 진, 잎 진 뒤, 낙엽이 끝]
  - name: 첫해 참기
    match: [첫해, 첫 해]
  - name: 이름·닮은 나무 구별
    match: [구별, 구분, 헷갈, 한 나무, 같은 나무]
  - name: 오늘 할 일 하나
    match: [오늘 할, 오늘 그루, 말뚝, 리본]
  - name: 다음 편 예고
    match: [이어지는 편, 따로 적겠, 다음 편, 다음 글]
  - name: 거름 자리(가지 끝 둘레)
    match: [가지 끝 아래, 가지 끝이 그리는, 수관 둘레, 밑동은 비우]
  - name: 자르는 자리(눈 위)
    match: [눈 하나 위, 눈 위]
