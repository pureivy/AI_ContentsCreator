name: bionditree
industry: 나무·묘목 (유실수·조경수·정원수)
description: >-
  묘목부터 나무까지, 재배 기록


  작게 시작해도


  충분히 자랍니다


  사과나무 한 그루, 마당의 단풍 한 그루, 화분의 블루베리나무 한 그루까지. 묘목을 심고 키워 뿌리내리게 하는 법을, 좋은 묘목 고르는
  요령, 전정 등 계절별 나무 관리 방법까지 곁들여 차곡차곡 기록합니다.
products: []
region: 경북 경산
banned:
  - 채소·텃밭 작물 주제(배추·상추·토마토·가을채소·베란다 채소 등) — 나무·묘목 브랜드와 무관
  - 화초·구근·꽃 모종 주제(튤립·수선화·페튜니아·제라늄 등)
  - 다육·선인장·관엽 등 나무가 아닌 화분 식물 주제
seedKeywords:
